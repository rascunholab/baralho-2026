<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <!-- CSP: sem rede, sem formulários, sem objetos. Único frame permitido: YouTube sem cookies (youtube-nocookie.com), carregado só depois de um clique. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'none'">
  <title>Baralho 2026 — Qual é a sua opinião?</title>
  <meta name="description" content="Jogo para comparar o que Lula e Flávio Bolsonaro já fizeram, disseram e prometem. Leia a carta, responda e só depois descubra quem foi. Com fontes, sem coleta de dados.">
  <style>
/* =====================================================================
   BARALHO 2026 — ESTILOS
   Sem fontes externas, sem imagens externas, sem frameworks.
   Cores dos candidatos são propositalmente neutras (não são as dos partidos).
   ===================================================================== */
:root {
  --felt-950: #04201a;
  --felt-900: #062b22;
  --felt-800: #0a3a2d;
  --felt-700: #0f4d3b;
  --felt-600: #176650;
  --gold: #e8bd4f;
  --gold-soft: #f6dd9b;
  --ivory: #fbf7ec;
  --ivory-2: #f3ecd9;
  --ink: #17201d;
  --ink-soft: #3d4a45;
  --muted: #5d6b65;
  --line: #d9cfb6;
  --red: #b3261e;
  --teal: #0b6e6e;      /* Flávio Bolsonaro (ordem alfabética) */
  --teal-soft: #d5ecec;
  --amber: #9a4d06;     /* Lula */
  --amber-soft: #fbe6c8;
  --ok: #1f7a3f;
  --bad: #a3271f;
  --radius: 20px;
  --shadow: 0 18px 40px rgba(0, 0, 0, .35), 0 3px 8px rgba(0, 0, 0, .25);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.5;
  color: var(--ivory);
  background:
    radial-gradient(1200px 700px at 50% -10%, var(--felt-600) 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 100%, var(--felt-700) 0%, transparent 55%),
    linear-gradient(180deg, var(--felt-800), var(--felt-950));
  background-color: var(--felt-900);
  background-attachment: fixed;
}
body::before { /* textura de feltro sutil, sem imagem */
  content: "";
  position: fixed; inset: 0; pointer-events: none; opacity: .5;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 4px);
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 8px; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; } /* foco programático em títulos */

/* ---------- estrutura ---------- */
.app { position: relative; max-width: 820px; margin: 0 auto; padding: 0 16px 56px; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px 0 10px;
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(145deg, var(--ivory), var(--ivory-2));
  color: var(--red); display: grid; place-items: center; font-size: 22px; line-height: 1;
  box-shadow: 0 4px 10px rgba(0,0,0,.35);
  transform: rotate(-6deg);
}
.brand-name { font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: .3px; color: var(--ivory); }
.brand-name small { font-family: var(--sans); font-weight: 600; font-size: 12px; color: var(--gold); letter-spacing: 1.5px; margin-left: 6px; }
.topnav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 20px; border-radius: 999px;
  border: 2px solid transparent; cursor: pointer; font-weight: 700; text-decoration: none;
  transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease;
}
.btn:active { transform: translateY(1px) scale(.99); }
.btn-primary { background: linear-gradient(180deg, #f4cf6a, var(--gold)); color: #2b2100; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.btn-primary:hover { background: linear-gradient(180deg, #f8d97f, #edc45c); }
.btn-ghost { background: rgba(255,255,255,.08); color: var(--ivory); border-color: rgba(255,255,255,.28); }
.btn-ghost:hover { background: rgba(255,255,255,.16); }
.btn-light { background: var(--ivory); color: var(--ink); border-color: var(--line); }
.btn-light:hover { background: #fff; }
.btn-sm { min-height: 40px; padding: 6px 14px; font-size: 15px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

h1, h2, h3 { font-family: var(--serif); line-height: 1.15; margin: 0; }
.screen { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- home ---------- */
.hero { text-align: center; padding: 18px 0 8px; }
.hero h1 { font-size: clamp(36px, 8vw, 58px); letter-spacing: .5px; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
.hero h1 span { color: var(--gold); }
.hero p { max-width: 560px; margin: 14px auto 0; color: #e7efe9; font-size: 19px; }
.fan { position: relative; height: 210px; margin: 26px auto 8px; max-width: 420px; }
.fan .mini {
  position: absolute; left: 50%; top: 0; width: 118px; height: 168px; margin-left: -59px;
  border-radius: 14px; background: linear-gradient(160deg, var(--ivory), var(--ivory-2));
  border: 1px solid var(--line); box-shadow: var(--shadow);
  transform-origin: 50% 120%; display: grid; place-items: center;
  font-family: var(--serif); color: var(--ink);
  animation: fanin .7s cubic-bezier(.2,.9,.3,1.1) both;
}
.fan .mini b { font-size: 34px; }
.fan .mini span { position: absolute; top: 8px; left: 10px; font-size: 18px; font-weight: 700; }
.fan .mini span.br { top: auto; left: auto; bottom: 8px; right: 10px; transform: rotate(180deg); }
.fan .mini.r { color: var(--red); }
.fan .mini:nth-child(1) { --a: -24deg; animation-delay: .00s; }
.fan .mini:nth-child(2) { --a: -12deg; animation-delay: .08s; }
.fan .mini:nth-child(3) { --a: 0deg;   animation-delay: .16s; }
.fan .mini:nth-child(4) { --a: 12deg;  animation-delay: .24s; }
.fan .mini:nth-child(5) { --a: 24deg;  animation-delay: .32s; }
@keyframes fanin { from { transform: rotate(0deg) translateY(30px); opacity: 0; } to { transform: rotate(var(--a)) translateY(0); opacity: 1; } }
.stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 10px 0 22px; padding: 0; list-style: none; }
.stats li { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 14px; font-size: 15px; }
.stats li b { color: var(--gold-soft); }
.actions { display: grid; gap: 12px; max-width: 520px; margin: 0 auto; }
@media (min-width: 560px) { .actions { grid-template-columns: 1fr 1fr; } }
.action {
  text-align: left; padding: 18px 18px 16px; border-radius: var(--radius); cursor: pointer;
  background: linear-gradient(160deg, var(--ivory), var(--ivory-2)); color: var(--ink);
  border: 2px solid transparent; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease;
}
.action:hover { transform: translateY(-3px); border-color: var(--gold); }
.action .ico { font-size: 26px; display: block; margin-bottom: 4px; }
.action strong { font-family: var(--serif); font-size: 21px; display: block; }
.action span.d { color: var(--ink-soft); font-size: 15px; display: block; margin-top: 4px; }
.fine { max-width: 620px; margin: 22px auto 0; text-align: center; color: #cfe0d6; font-size: 14px; }
.fine a, .linkish { color: var(--gold-soft); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; font-size: inherit; }

/* ---------- painéis genéricos ---------- */
.panel {
  background: linear-gradient(160deg, var(--ivory), var(--ivory-2));
  color: var(--ink); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
}
.panel h2 { font-size: 26px; margin-bottom: 6px; }
.panel p { color: var(--ink-soft); }
.back-link { margin: 8px 0 14px; }

/* setup */
.count-big { font-family: var(--serif); font-size: 64px; line-height: 1; color: var(--ink); text-align: center; margin: 10px 0 0; }
.count-sub { text-align: center; color: var(--ink-soft); margin: 4px 0 18px; }
.range { width: 100%; accent-color: var(--felt-700); height: 36px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 10px 0 20px; }
.chip {
  border-radius: 999px; border: 2px solid var(--line); background: #fff; color: var(--ink);
  padding: 6px 14px; font-weight: 700; cursor: pointer; min-height: 40px;
}
.chip[aria-pressed="true"] { background: var(--felt-700); border-color: var(--felt-700); color: var(--ivory); }
.split { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
.split .pill { flex: 1; max-width: 220px; text-align: center; padding: 8px 10px; border-radius: 14px; font-weight: 700; }
.pill-flavio { background: var(--teal-soft); color: #064848; }
.pill-lula { background: var(--amber-soft); color: #6d3604; }
.pill i { font-style: normal; }

/* ---------- carta ---------- */
.progress { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; }
.progress .bar { flex: 1; height: 10px; border-radius: 999px; background: rgba(255,255,255,.16); overflow: hidden; }
.progress .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #fff2c4); width: 0; transition: width .35s ease; }
.progress .num { font-weight: 700; font-size: 15px; white-space: nowrap; color: var(--gold-soft); }

.stage { perspective: 1400px; }
.card {
  position: relative; background: linear-gradient(165deg, #fffdf6, var(--ivory) 55%, var(--ivory-2));
  color: var(--ink); border-radius: 26px; border: 1px solid var(--line);
  box-shadow: var(--shadow), inset 0 0 0 7px rgba(255,255,255,.55), inset 0 0 0 8px var(--line);
  padding: 34px 26px 24px; min-height: 380px;
  transform-style: preserve-3d; transition: transform .28s ease, opacity .28s ease;
}
.card:not(.reveal) { padding-bottom: 76px; }
.card.reveal { min-height: 0; padding: 22px 22px 20px; text-align: left; }
.card.reveal .idx { display: none; }
.card.flip-out { transform: rotateY(90deg); opacity: .2; }
.card.flip-in { animation: flipin .34s ease both; }
@keyframes flipin { from { transform: rotateY(-90deg); opacity: .2; } to { transform: rotateY(0); opacity: 1; } }
.idx { position: absolute; display: grid; justify-items: center; line-height: 1; font-family: var(--serif); font-weight: 700; font-size: 22px; }
.idx .s { font-size: 24px; margin-top: 3px; }
.idx.tl { top: 16px; left: 18px; }
.idx.br { bottom: 16px; right: 18px; transform: rotate(180deg); }
.idx.red { color: var(--red); }
.q { text-align: center; margin: 4px 0 0; }
.q small { display: block; color: var(--red); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; }
.q strong { font-family: var(--serif); font-size: 26px; display: block; }
.statement {
  font-family: var(--serif); font-size: clamp(22px, 4.6vw, 30px); line-height: 1.3; text-align: center;
  margin: 22px auto 18px; max-width: 30ch; padding: 0 10px; color: #101815; text-wrap: balance;
}
/* sem aspas decorativas: muitas cartas são paráfrases, não citações literais */
.statement::before { content: ""; display: block; width: 54px; height: 4px; border-radius: 4px; background: var(--gold); margin: 0 auto 18px; }
.tag {
  display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 800;
  letter-spacing: .6px; text-transform: uppercase; background: var(--felt-800); color: var(--gold-soft);
}
.tag-wrap { text-align: center; }
.answers { display: grid; gap: 12px; margin-top: 18px; }
@media (min-width: 600px) { .answers { grid-template-columns: 1fr 1fr; } .answers .skip { grid-column: 1 / -1; } }
.ans {
  display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px;
  border-radius: 18px; border: 3px solid transparent; cursor: pointer; font-weight: 800; font-size: 20px;
  transition: transform .12s ease, filter .12s ease; box-shadow: 0 6px 14px rgba(0,0,0,.22);
}
.ans:hover { transform: translateY(-2px); filter: brightness(1.05); }
.ans:active { transform: translateY(1px); }
.ans.good { background: var(--ok); color: #fff; }
.ans.bad { background: var(--bad); color: #fff; }
.ans.skip { background: #fff; color: var(--ink); border-color: var(--line); min-height: 52px; font-size: 17px; }
.ans kbd { font: 700 12px var(--sans); background: rgba(255,255,255,.25); border-radius: 6px; padding: 2px 7px; }
.ans.skip kbd { background: var(--ivory-2); }
@media (hover: none) { .ans kbd { display: none; } }

/* ---------- revelação ---------- */
.who {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; margin: 4px 0 16px;
}
.who.lula { background: var(--amber-soft); }
.who.flavio { background: var(--teal-soft); }
.avatar {
  flex: none; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--serif); font-weight: 800; font-size: 24px; color: #fff; border: 3px solid #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,.25);
}
.lula .avatar { background: var(--amber); }
.flavio .avatar { background: var(--teal); }
.who .kicker { font-size: 13px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-soft); }
.who .name { font-family: var(--serif); font-size: 28px; font-weight: 800; line-height: 1.1; }
.who .role { font-size: 15px; color: var(--ink-soft); }
.verdict { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
  font-size: 14px; font-weight: 800; border: 2px solid transparent;
}
.badge.good { background: #d9f0e0; color: #14562b; border-color: #9ed3ae; }
.badge.bad { background: #f8dcd9; color: #7d1d17; border-color: #e5a7a1; }
.badge.skip { background: #ece6d4; color: #4b4637; border-color: var(--line); }
.badge.info { background: #fff; color: var(--ink); border-color: var(--line); }
.quote-small { font-family: var(--serif); font-size: 19px; line-height: 1.35; margin: 4px 0 14px; padding-left: 14px; border-left: 4px solid var(--gold); color: var(--ink); }
.block { margin: 14px 0; }
.block h3 { font-family: var(--sans); font-size: 13px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.block p { margin: 0; color: var(--ink); }
.note { background: #fff8e3; border: 1px solid #ecd48a; border-radius: 14px; padding: 12px 14px; color: #4a3d0c; }
.sources { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.src { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: #fff; }
.src a { font-weight: 700; color: #0b4f8a; text-decoration: underline; text-underline-offset: 3px; word-break: break-word; }
.src .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 14px; color: var(--muted); }
.src .na { margin-top: 6px; font-size: 14px; color: #7a4a00; }
.kind { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; letter-spacing: .4px; text-transform: uppercase; }
.kind.oficial { background: #d9eadf; color: #0f5130; }
.kind.imprensa { background: #dbe7f6; color: #0f3d73; }
.kind.checagem { background: #e8dcf6; color: #4a1f7a; }
.kind.opiniao { background: #eee7d7; color: #5a4a1e; border: 1px dashed #b9a769; }
.legend { font-size: 14px; color: var(--muted); margin-top: 10px; }
.nextrow { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-top: 18px; }

/* ---------- resultado ---------- */
.result-hero { text-align: center; }
.result-hero .over { font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.result-hero h2 { font-size: clamp(28px, 6vw, 40px); margin: 6px 0 4px; }
.result-hero .who-big { display: inline-flex; align-items: center; gap: 14px; margin: 10px 0 6px; padding: 10px 22px 10px 12px; border-radius: 999px; }
.result-hero .who-big.lula { background: var(--amber-soft); }
.result-hero .who-big.flavio { background: var(--teal-soft); }
.result-hero .who-big.tie { background: #ece6d4; padding-left: 22px; }
.result-hero .who-big .nm { font-family: var(--serif); font-size: 30px; font-weight: 800; }
.bars { display: grid; gap: 14px; margin: 18px 0 4px; }
.barrow .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-weight: 800; }
.barrow .top span { font-weight: 600; color: var(--ink-soft); font-size: 15px; }
.track { height: 22px; border-radius: 999px; background: #e7dfc9; overflow: hidden; margin-top: 6px; }
.track > i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.track.lula > i { background: linear-gradient(90deg, #c46a14, var(--amber)); }
.track.flavio > i { background: linear-gradient(90deg, #12908f, var(--teal)); }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 8px; }
.tbl th, .tbl td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.tbl .l { color: var(--amber); font-weight: 800; }
.tbl .f { color: var(--teal); font-weight: 800; }
.tbl-wrap { overflow-x: auto; }
details.rev { border: 1px solid var(--line); border-radius: 14px; background: #fff; margin-top: 8px; }
details.rev > summary { cursor: pointer; padding: 12px 14px; list-style: none; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
details.rev > summary::-webkit-details-marker { display: none; }
details.rev > summary .t { flex: 1; font-family: var(--serif); font-size: 17px; }
details.rev > summary .r { flex: none; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
details.rev .in { padding: 4px 14px 14px; }
.disclaimer { margin-top: 16px; padding: 14px; border-radius: 14px; background: #eef3ee; border: 1px solid #c9d8cc; color: #26362d; font-size: 15px; }
.disclaimer ul { margin: 6px 0 0 18px; padding: 0; }

/* ---------- navegar / escolher ---------- */
.search {
  width: 100%; min-height: 50px; border-radius: 14px; border: 2px solid var(--line); padding: 10px 14px; font: inherit; color: var(--ink); background: #fff;
}
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.grid { display: grid; gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
.pick {
  text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 14px 14px 12px; cursor: pointer; color: var(--ink);
  display: grid; gap: 10px; transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.pick:hover { transform: translateY(-2px); border-color: var(--felt-700); box-shadow: 0 8px 18px rgba(0,0,0,.15); }
.pick .s { font-family: var(--serif); font-size: 18px; line-height: 1.3; }
.pick .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pick .suit { font-size: 20px; }
.pick .suit.red { color: var(--red); }
.empty { text-align: center; color: var(--ink-soft); padding: 18px; }

/* ---------- janela (sobre / ajustes) ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(2, 14, 10, .72); display: grid; place-items: center; padding: 14px; }
.modal {
  width: min(760px, 100%); max-height: 90vh; overflow: auto; background: var(--ivory); color: var(--ink);
  border-radius: 22px; padding: 22px; box-shadow: var(--shadow);
}
.modal h2 { font-size: 28px; margin-bottom: 8px; }
.modal h3 { font-size: 20px; margin: 18px 0 6px; }
.modal p, .modal li { color: var(--ink-soft); }
.modal ul, .modal ol { padding-left: 20px; }
.adj { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 12px; margin-top: 8px; }
.adj .h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.adj .n { font-family: var(--serif); font-weight: 800; }
.adj .a { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: #e8e1cc; text-transform: uppercase; letter-spacing: .4px; }
.adj .a.rem { background: #f8dcd9; color: #7d1d17; }
.adj .o { font-family: var(--serif); margin: 6px 0 2px; color: var(--ink); }
.adj .m { margin: 0; font-size: 15px; }

  /* ------------------------- validação ------------------------- */
  function validar() {
    var erros = [];

      if (!cont.hasOwnProperty(c.c)) { erros.push("Autor inválido em " + c.id); } else { cont[c.c]++; }
      if (!D.temas[c.tema]) { erros.push("Tema inválido em " + c.id); }
      if (!c.texto || !lista(c.resumo).length || !c.fontes || !c.fontes.length) { erros.push("Carta incompleta: " + c.id); }
      (c.fontes || []).forEach(function (f) { if (!urlSegura(f.u)) { erros.push("Link inválido em " + c.id); } });

      if (!a || !b) { erros.push("Duelo com carta inexistente: " + d.id); return; }
      if (a.c !== "lula" || b.c !== "flavio") { erros.push("Duelo fora do padrão (a = Lula, b = Flávio): " + d.id); }
      if (usadas[d.a] || usadas[d.b]) { erros.push("Carta repetida em duelos: " + d.id); }

  /* ------------------------- janelas ------------------------- */

    var anterior = document.activeElement;
    var ov = el("div", { class: "overlay", role: "presentation" });
    var m = el("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "mt", tabindex: "-1" }, [

    ]);
    ov.appendChild(m);
    ov.addEventListener("click", function (e) { if (e.target === ov) { fechar(); } });
    function onKey(e) {
      if (e.key === "Escape") { fechar(); return; }
      if (e.key === "Tab") {
        var f = m.querySelectorAll("a[href], button, summary, [tabindex]:not([tabindex='-1'])");
        if (!f.length) { return; }
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }

      document.removeEventListener("keydown", onKey, true);
      if (ov.parentNode) { ov.parentNode.removeChild(ov); }
      document.body.style.overflow = "";

    document.addEventListener("keydown", onKey, true);
    document.body.style.overflow = "hidden";
    document.body.appendChild(ov);

  /* ---- fila equilibrada ---- */
  function intercalar(L, F) {
    var out = [], ult = null, run = 0;
    L = L.slice(); F = F.slice();
    while (L.length || F.length) {
      var lado;
      if (!L.length) { lado = "f"; }
      else if (!F.length) { lado = "l"; }
      else if (ult && run >= 2) { lado = ult === "l" ? "f" : "l"; }
      else { lado = rnd(L.length + F.length) < L.length ? "l" : "f"; }
      if (lado === ult) { run++; } else { ult = lado; run = 1; }
      out.push(lado === "l" ? L.pop() : F.pop());
    }
    return out;
  }

  function montarFila(n, cats, nJair) {
    var meio = n / 2;
    var P = candidatos().filter(function (c) { return cats[catDe(c)]; });
    var L = shuffle(P.filter(function (c) { return c.c === "lula"; })).slice(0, meio);
    var F = shuffle(P.filter(function (c) { return c.c === "flavio"; })).slice(0, meio);
    var base = intercalar(L, F);
    if (nJair > 0 && cats.frase) {
      var J = shuffle(cartasJair()).slice(0, nJair);
      J.forEach(function (j) { base.splice(rnd(base.length + 1), 0, j); });
    }
    return base;
  }

        el("div", { class: "nextrow" }, [
          el("button", { class: "btn btn-light", type: "button", text: "← Início", onclick: telaInicio }),
          el("button", { class: "btn btn-primary", type: "button", text: "Jogar", onclick: telaConfigurar })
        ])
      ])
    ]);
    montar(raiz, "#titulo");
  }

  /* ---- resultado ---- */
  function calcular() {
    var r = { lula: { ap: 0, rj: 0, sk: 0, n: 0 }, flavio: { ap: 0, rj: 0, sk: 0, n: 0 }, jair: { ap: 0, rj: 0, sk: 0, n: 0 } };
    var temas = {};
    S.resp.forEach(function (x) {
      var c = x.carta.c;
      var alvo = (c === "jair" && REGRAS.contarJairParaFlavio) ? "flavio" : c;
      var o = r[alvo];
      o.n++;
      if (x.v === "bom") { o.ap++; } else if (x.v === "ruim") { o.rj++; } else { o.sk++; }
      if (c === "jair") { var oj = r.jair; if (alvo !== "jair") { oj.n++; if (x.v === "bom") { oj.ap++; } else if (x.v === "ruim") { oj.rj++; } else { oj.sk++; } } return; }
      if (!temas[x.carta.tema]) { temas[x.carta.tema] = { lula: { ap: 0, resp: 0 }, flavio: { ap: 0, resp: 0 } }; }
      if (x.v !== "pular") { temas[x.carta.tema][c].resp++; if (x.v === "bom") { temas[x.carta.tema][c].ap++; } }
    });
    ["lula", "flavio", "jair"].forEach(function (c) {
      var resp = r[c].ap + r[c].rj;
      r[c].resp = resp;
      r[c].p = resp ? r[c].ap / resp : null;
    });
    return { r: r, temas: temas };
  }

  function chipUrna(c) {
    var cd = D.candidatos[c];
    return el("div", { class: "urna " + c }, [
      retrato(c, "md"),
      el("div", null, [
        el("div", { class: "un", text: cd.nome }),
        el("div", { class: "up", text: cd.partido }),
        el("div", { class: "num", "aria-label": "Número na urna " + cd.numero }, [el("small", { text: "Na urna: " }), cd.numero])
      ])
    ]);
  }

  function cartaoVencedor(c, tamanho) {
    var cd = D.candidatos[c];
    return el("div", { class: "winner " + c }, [
      retrato(c, tamanho),
      el("div", { class: "wname", text: cd.nome }),
      el("div", { class: "wnum" }, [el("small", { text: "Número na urna" }), el("b", { text: cd.numero })])
    ]);
  }

  function telaResultado() {
    var calc = calcular();
    var r = calc.r;
    var fl = r.flavio, lu = r.lula, ja = r.jair;
    var totalResp = fl.resp + lu.resp;
    var lider = null, empate = false, semDados = false;
    if (fl.p === null || lu.p === null) {
      if (fl.p === null && lu.p === null) { semDados = true; }
      else { lider = fl.p === null ? "lula" : "flavio"; }
    } else if (Math.abs(fl.p - lu.p) < 0.0001) { empate = true; }
    else { lider = fl.p > lu.p ? "flavio" : "lula"; }
    var diff = (fl.p !== null && lu.p !== null) ? Math.abs(fl.p - lu.p) : 1;

    var hero;
    if (semDados) {
      hero = el("div", { class: "result-hero" }, [
        el("div", { class: "over", text: "Resultado" }),
        el("h2", { id: "titulo", text: "Você não respondeu nenhuma carta dos candidatos" }),
        el("p", { text: "Jogue de novo e responda “Bom/Concordo” ou “Ruim/Não concordo” para ver com quem você combina." })
      ]);
    } else if (empate) {
      hero = el("div", { class: "result-hero" }, [
        el("div", { class: "over", text: "Resultado" }),
        el("h2", { id: "titulo", text: "Empate! Você combina igual com os dois." }),
        el("div", { class: "winners tie" }, ORDEM_CAND.map(function (c) { return cartaoVencedor(c, "xl"); })),
        el("p", { class: "wtext", text: "Você marcou “Bom” ou “Concordo” na mesma proporção de cartas dos dois candidatos (" + pct(fl.p) + " de cada). Veja as provas abaixo." })
      ]);
    } else {
      var cd = D.candidatos[lider];
      var o2 = outro(lider);
      hero = el("div", { class: "result-hero" }, [
        el("div", { class: "over", text: "Pelas suas respostas" }),
        el("h2", { id: "titulo", text: "Você combina mais com:" }),
        el("div", { class: "winners" }, [cartaoVencedor(lider, "xxl")]),
        el("p", { class: "wtext", text: "Você marcou “Bom” ou “Concordo” em " + r[lider].ap + " de " + r[lider].resp + " cartas de " + cd.nome + " (" + pct(r[lider].p) + ") e em " + r[o2].ap + " de " + r[o2].resp + " cartas de " + D.candidatos[o2].nome + " (" + (r[o2].p === null ? "nenhuma respondida" : pct(r[o2].p)) + ")." })
      ]);
    }

    var avisos = [];
    if (!semDados && !empate && diff < 0.1) { avisos.push("Resultado apertado: a diferença é pequena. Leia as provas com calma antes de decidir."); }
    if (totalResp > 0 && totalResp < 8) { avisos.push("Você respondeu poucas cartas (" + totalResp + "). Jogue com mais cartas para o resultado ser mais confiável."); }
    var pulou = fl.sk + lu.sk;
    if (pulou > 0) { avisos.push("Você marcou “Não sei” em " + pulou + " carta(s). Elas não contam pontos."); }

    function linhaBarra(chave) {
      var o = r[chave], cd = D.candidatos[chave];
      var barra = el("i", { style: "width:0%" });
      setTimeout(function () { barra.style.width = (o.p === null ? 0 : Math.round(o.p * 100)) + "%"; }, 60);
      return el("div", { class: "barrow" }, [
        el("div", { class: "top" }, [
          el("span", { text: cd.nome + " (" + cd.partido + ")" }),
          el("span", { text: o.p === null ? "nenhuma respondida" : "“Bom” ou “Concordo” em " + o.ap + " de " + o.resp + " · " + pct(o.p) })
        ]),
        el("div", { class: "track " + chave, role: "img", "aria-label": cd.nome + ": " + (o.p === null ? "nenhuma respondida" : pct(o.p) + " de frases aprovadas") }, [barra])
      ]);
    }

    var blocoJair = null;
    var temJair = S.resp.some(function (x) { return x.carta.c === "jair"; });
    if (temJair) {
      var jair = r.jair;
      blocoJair = el("div", { class: "block jair-res" }, [
        el("h3", { text: "Frases de Jair Bolsonaro" }),
        el("div", { class: "who jair" }, [
          retrato("jair"),
          el("div", null, [
            el("div", { class: "name", text: "Jair Bolsonaro" }),
            el("div", { class: "role", text: jair.p === null ? "Você não respondeu a nenhuma frase dele." : "Você concordou com " + jair.ap + " de " + jair.resp + " frases (" + pct(jair.p) + ")." })
          ])
        ]),
        el("p", { class: "legend", text: REGRAS.contarJairParaFlavio ? "Nesta versão, as frases dele somam para o lado de Flávio." : "Jair Bolsonaro, ex-presidente e pai de Flávio, não é candidato nesta eleição. Por isso estas frases não deram ponto para nenhum candidato." })
      ]);
    }

    var linhasTema = Object.keys(D.temas).filter(function (t) { return calc.temas[t]; }).map(function (t) {
      var x = calc.temas[t];
      function cel(c) { return x[c].resp ? x[c].ap + " de " + x[c].resp : "—"; }
      return el("tr", null, [
        el("td", { text: D.temas[t].naipe + " " + D.temas[t].nome }),
        el("td", { class: "f", text: cel("flavio") }),
        el("td", { class: "l", text: cel("lula") })
      ]);
    });

    var revisao = S.resp.map(function (x, k) {
      var det = el("details", { class: "rev" });
      var sum = el("summary", null, [
        el("span", { class: "t", text: (k + 1) + ". " + x.carta.texto }),
        el("span", { class: "r" }, [
          el("span", { class: "badge " + (x.v === "bom" ? "good" : x.v === "ruim" ? "bad" : "skip"), text: rotuloResp(x.carta, x.v) }),
          el("span", { class: "badge info", text: D.candidatos[x.carta.c].nome })
        ])
      ]);
      var preenchido = false;
      det.addEventListener("toggle", function () {
        if (det.open && !preenchido) { preenchido = true; det.appendChild(el("div", { class: "in" }, blocoRevelacao(x.carta, x.v, { mostrarFala: false }))); }
      });
      det.appendChild(sum);
      return det;
    });

    var raiz = el("section", { class: "screen" }, [
      el("div", { class: "panel" }, [
        hero,
        el("div", { class: "bars" }, ORDEM_CAND.map(linhaBarra)),
        avisos.length ? el("div", { class: "note", style: "margin-top:14px" }, avisos.map(function (a) { return el("p", { text: a }); })) : null,
        blocoJair,
        el("div", { class: "block" }, [
          el("h3", { text: "Os candidatos e o número na urna" }),
          el("div", { class: "urnas" }, ORDEM_CAND.map(chipUrna)),
          el("p", { class: "legend", text: D.candidatos.flavio.credito + ". " + D.candidatos.lula.credito + "." })
        ]),
        el("div", { class: "block" }, [
          el("h3", { text: "Por tema: em quantas cartas você marcou “Bom” ou “Concordo”" }),
          el("div", { class: "tbl-wrap" }, [
            el("table", { class: "tbl" }, [
              el("thead", null, el("tr", null, [el("th", { text: "Tema" }), el("th", { text: "Flávio Bolsonaro" }), el("th", { text: "Lula" })])),
              el("tbody", null, linhasTema)
            ])
          ])
        ]),
        el("div", { class: "block" }, [el("h3", { text: "Suas respostas e as provas" }), revisao]),
        el("div", { class: "disclaimer" }, [
          el("strong", { text: "Leia antes de decidir" }),
          el("ul", null, [
            el("li", { text: "Este resultado só mostra o que VOCÊ achou bom ou ruim, ou com o que concordou, nas cartas que jogou." }),
            el("li", { text: "O jogo não mede se alguém é honesto ou competente, nem o que já fez no passado." }),
            el("li", { text: "As cartas cobrem " + Object.keys(D.temas).length + " temas. Não têm tudo o que os candidatos propõem." }),
            el("li", { text: "Os fatos foram conferidos em " + D.versao + " e podem mudar até a eleição. Os planos completos estão no site do TSE." }),
            el("li", { text: "O voto é seu e é secreto. Suas respostas não saíram do seu aparelho." })
          ])
        ]),
        el("div", { class: "nextrow" }, [
          el("button", { class: "btn btn-light", type: "button", text: "← Início", onclick: telaInicio }),
          el("div", { style: "display:flex;gap:10px;flex-wrap:wrap" }, [
            el("button", { class: "btn btn-light", type: "button", text: "Promessas e projetos", onclick: telaPainel }),
            el("button", { class: "btn btn-primary", type: "button", text: "Jogar de novo", onclick: telaConfigurar })
          ])
        ])
      ])
    ]);
    montar(raiz, "#titulo");
    anunciar(semDados ? "Fim do jogo." : empate ? "Fim do jogo. Empate." : "Fim do jogo. Você combina mais com " + D.candidatos[lider].nome + ", número " + D.candidatos[lider].numero + ".");
  }

  /* ------------------------- teclado e navegação ------------------------- */
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) { return; }
    if (document.querySelector(".overlay")) { return; }
    var t = e.target && e.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || t === "A" || t === "BUTTON" || t === "SUMMARY") { return; }
    var k = (e.key || "").toLowerCase();
    if (DU.ativo) {
      if (!DU.respondida) {
        var map = { a: "A", b: "B", d: "duas", n: "nenhuma", s: "nao" };
        if (map[k]) {
          var alvo = document.querySelector(".duelresp .ans:nth-child(" + ({ A: 1, B: 2, duas: 3, nenhuma: 4, nao: 5 })[map[k]] + ")");
          if (alvo) { alvo.click(); }
        }
      } else if (k === "enter" || k === "arrowright") {
        var pb = document.getElementById("proximo-duelo");
        if (pb) { e.preventDefault(); pb.click(); }
      }
      return;
    }
    if (!S.atual || !S.modo) { return; }
    if (!S.atual.respondida) {
      if (k === "b" || k === "c") { responder("bom"); } else if (k === "r" || k === "n") { responder("ruim"); } else if (k === "s") { responder("pular"); }
    } else if (k === "enter" || k === "arrowright") {
      var b = document.getElementById("proxima");
      if (b) { e.preventDefault(); b.click(); }
    }
  });
  document.getElementById("btn-home").addEventListener("click", telaInicio);
  document.getElementById("btn-sobre").addEventListener("click", janelaComoFunciona);
  document.getElementById("btn-palavras").addEventListener("click", janelaPalavras);
  document.getElementById("btn-painel").addEventListener("click", telaPainel);

  telaInicio();
})();
</script>

</body>
</html>
